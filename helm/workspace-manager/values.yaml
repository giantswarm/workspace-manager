# Default values for workspace-manager.

# -- Number of replicas. The server keeps no MCP session state (a session
# begun on one replica continues on another), so two or more are fine. Tokens issued by its own OAuth flow (a client that signs
# in to it directly) live in one replica's memory; muster's forwarded Dex
# tokens are validated by every replica.
replicaCount: 1

# -- Number of old ReplicaSets retained for rollback.
revisionHistoryLimit: 3

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/workspace-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []  # @schema item: object ; itemProperties: {name: {type: string}}
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""

# The platform contract a parent chart (the `agent-platform` meta chart)
# provides and this chart reads as fallbacks for `oauth.*`:
# `global.identity.issuerUrl`, `global.identity.clientId`,
# `global.identity.existingSecret`, `global.identity.ca.secretName` / `.key`,
# and `global.domain` for the OAuth base URL. Empty here; a chart installed on
# its own sets `oauth.*` directly.
global: {}  # @schema type: object; additionalProperties: true

workspaces:
  # -- Namespace the workspaces and everything they own live in: the
  # namespace kagent runs its sessions in. The manager's Role
  # (`rbac.create`) is rendered here.
  namespace: kagent

storage:
  # -- The read-write-many StorageClass every workspace's volume is claimed
  # from (the PersistentVolumeClaim's `spec.storageClassName`, access mode
  # ReadWriteMany): bare mirrors and a directory per Session, used by git, so
  # the class keeps POSIX semantics (file modes, symbolic links): Amazon EFS,
  # Azure Files over NFS, an NFS server. A cluster rarely has such a class by
  # default, and the manager never falls back to the cluster's default class:
  # empty, no volume is claimed and every Workspace's `VolumeClaimed`
  # condition names this value. Passed to `serve` as its `storage-class` flag.
  storageClassName: ""
  # The size a workspace volume is created with where the StorageClass
  # provisions a size (Amazon EFS and NFS ignore it): the mirrors' and session
  # directories' measured size times `factor`, plus `headroom`, at least the
  # Workspace's `spec.sizing.minimum`, capped at `maxSize`. Before a sync
  # measured anything the claim asks for 1Gi.
  sizing:
    # -- Multiplier of the measured size, at least 1: a number or a string
    # (`"1.5"`). Passed to `serve` as its `sizing-factor` flag.
    factor: "1.5"  # @schema type: [string, number]; pattern: ^[0-9]+(\.[0-9]+)?$
    # -- Added to the multiplied size, a Kubernetes quantity; a Workspace's
    # larger `spec.sizing.headroom` replaces it. Passed to `serve` as its
    # `sizing-headroom` flag.
    headroom: 5Gi
    # -- Ceiling of the size, a Kubernetes quantity, which wins over a
    # Workspace's minimum. Empty sets none. Passed to `serve` as its
    # `sizing-max-size` flag.
    maxSize: ""

sync:
  # -- How often the controller reconciles every Workspace without an event,
  # a Go duration (`10m`, `1h`): a claim deleted out from under a Workspace is
  # made again by then. Each Workspace's own `spec.sync` (nightly, weekly or
  # custom) says when its mirrors are fetched. Passed to `serve` as its
  # `sync-cycle` flag.
  cycle: 10m

sessions:
  # -- How long a Session's directory on the workspace volume outlives the
  # Session's last turn, a Go duration (`720h` is 30 days). Passed to `serve`
  # as its `sessions-cleanup-after` flag.
  cleanupAfter: 720h

crds:
  # -- Install the `Workspace` CRD (`workspaces.workspace-manager.giantswarm.io`).
  # Kept on uninstall, so removing the chart never deletes a workspace.
  install: true

# -- The Organizations whose members manage workspaces, each with its member
# groups: a caller whose forwarded identity carries any of an Organization's
# groups reads and writes its workspaces, nobody else does. An Organization
# not listed has no members. Members are bound to nothing in
# `workspaces.namespace`; the manager writes as its ServiceAccount.
# For example `{giantswarm: {memberGroups: [giantswarm-ad:developers]}}`.
organizations: {}  # @schema additionalProperties: {type: object, additionalProperties: false, required: [memberGroups], properties: {memberGroups: {type: array, minItems: 1, items: {type: string, minLength: 1}}}}
# -- The installation's workspace providers, several at once: each a unique
# `name` (a DNS label: the name workspaces and sign-ins refer to), a `kind` and
# the kind's `values`. A duplicate name, an unknown kind or invalid values fail
# the server's start with a message naming the instance. Kind `github`
# (github.com or a GitHub Enterprise Server) takes `url` (default
# `https://github.com`), `apiURL` (derived from `url`), `app.id`,
# `app.privateKey` and `oauth.clientID`, `oauth.clientSecret`; a Secret
# reference is `{name, key}` of a Secret in the release namespace, e.g.
# `{name: github, kind: github, values: {app: {id: "123", privateKey: {name:
# github-agents-app, key: private-key}}, oauth: {clientID: Iv1.abc,
# clientSecret: {name: github-agents-app, key: client-secret}}}}`.
providers: []  # @schema item: object ; itemProperties: {name: {type: string}, kind: {type: string}, values: {type: object, additionalProperties: true}}

signin:
  keys:
    # -- Secret in the release namespace with the keys that seal each
    # person's provider sign-ins and the sign-in flow's state: each data
    # entry is a key id (a lower-case DNS label of at most 32 characters) and
    # its 32 random bytes. Required with `providers` and `oauth.enabled`; the
    # chart never renders it.
    secretName: ""
    # -- The id of the key that seals. The others still open what they
    # sealed, so a key rotates by adding a new one, making it current and
    # dropping the old one once every sign-in was written again.
    current: ""

grant:
  # -- The key the workspace grant a Session carries is signed with: `{name,
  # key}` of a Secret in the release namespace holding at least 32 random
  # bytes, read at start (a missing or short key fails it); the chart never
  # renders it. Empty signs no grant. Needs `providers` and `oauth.enabled`.
  signingKey:
    name: ""
    key: ""

tokenExchange:
  # -- The installation's kagent client: the only client the token exchange
  # `POST /token` (RFC 8693) answers, with the person's access token for a
  # provider instance. Empty serves no token exchange. Needs `providers` and
  # `oauth.enabled`; kagent's namespace belongs in
  # `networkPolicy.ingressNamespaces`.
  clientID: ""
  clientSecret:
    # -- Secret in the release namespace with the kagent client's secret,
    # read on every exchange; the chart never renders it.
    name: ""
    # -- Key of the client secret in that Secret.
    key: client-secret

mcp:
  # -- MCP endpoint path.
  path: /mcp

oauth:
  # -- Make workspace-manager an OAuth 2.1 resource server (mcp-oauth): the
  # MCP endpoint requires a bearer token Dex issued, and every call carries the
  # caller's identity and Dex token, from which the caller's Organization is
  # checked. muster forwards the session's Dex id_token (its
  # MCPServer registration with `auth.forwardToken`, unpinned like every
  # manager); it is validated against Dex's JWKS when its audience is in
  # `trustedAudiences`. Off: no caller, so nothing that needs an Organization
  # works; only for a server nothing but a trusted proxy can reach.
  enabled: false
  # -- Public base URL of this server: the issuer of its own OAuth metadata
  # (https, or http on loopback). Empty derives
  # `https://<fullname>.<global.domain>` when `global.domain` is set.
  baseURL: ""
  dex:
    # -- Dex issuer URL. Empty falls back to `global.identity.issuerUrl`.
    issuerURL: ""
    # -- Dex OAuth client ID. Empty falls back to `global.identity.clientId`.
    clientID: ""
    # -- Dex OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
    # -- Let the issuer resolve to a private or loopback address (an
    # in-cluster Dex).
    allowPrivateURLs: false
    # -- Secret with the CA of a Dex that serves a private certificate;
    # mounted and passed as the `dex-ca-file` flag. Empty name falls back to
    # `global.identity.ca.secretName` / `global.identity.ca.key`.
    caSecret:
      name: ""
      key: ca.crt
  # -- Existing Secret with the Dex client secret under `dex-client-secret`.
  # Empty falls back to `global.identity.existingSecret`; without that, the
  # chart renders a Secret from `oauth.dex.clientSecret`.
  existingSecret: ""
  # -- OAuth client IDs whose Dex id_tokens are accepted as bearer tokens (SSO
  # token forwarding). Empty falls back to `[global.identity.clientId]`, the
  # platform client MCP clients and the muster CLI log in with. The server
  # trusts the union of this list and `muster.mcpServer.auth.requiredAudiences`
  # (in that order, without duplicates): every token muster forwards carries
  # the required audiences by construction and they are what the
  # kube-apiserver trusts, so a portal session — whose id_token carries them
  # but not the platform client — is accepted without listing its client here.
  trustedAudiences: []
  sso:
    # -- Let Dex's JWKS endpoint resolve to a private address when validating
    # forwarded tokens (an in-cluster Dex).
    allowPrivateIPs: false
  # -- Accept unauthenticated dynamic client registration (labs only).
  allowPublicClientRegistration: false

muster:
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: workspace-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Workspaces of this installation, the sources agent sessions work on and their provider sign-ins, for the Agent Platform
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`. `forwardToken` makes muster forward the session's Dex
    # id_token byte-identical (the SSO path this chart trusts through its
    # trusted audiences). `requiredAudiences` are extra audiences that token
    # must carry — the Dex cross-client audience the kube-apiserver trusts
    # (`dex-k8s-authenticator` on Giant Swarm clusters; agentlab's is
    # `kubernetes`); muster requests them at login, so users re-login after a
    # change. They are trusted as bearer audiences by construction, since the
    # server's trusted audiences are `oauth.trustedAudiences` plus this list.
    # The registration is unpinned — no authorization server and no GitHub
    # App: a provider sign-in is the workspace-manager's own business.
    auth:
      forwardToken: true
      requiredAudiences: []

networkPolicy:
  # -- Create a Kubernetes NetworkPolicy for the pod (off when an umbrella
  # chart renders the policies).
  enabled: false
  # -- Namespaces allowed to reach the MCP endpoint (label
  # kubernetes.io/metadata.name). Empty allows ingress from the release
  # namespace only.
  ingressNamespaces: []
  # -- Allow egress to the Kubernetes API server.
  allowKubeAPI: true
  # -- Allow egress on 443 to every destination: Dex (discovery and JWKS).
  # Vanilla NetworkPolicy cannot select by name; narrow with egressCIDRs
  # instead when the addresses are known.
  allowInternet: true
  # -- Extra egress CIDRs.
  egressCIDRs: []
  # -- Namespaces allowed to scrape the metrics port (label
  # kubernetes.io/metadata.name), when `observability.metrics.enabled`.
  metricsNamespaces:
    - kube-system

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

rbac:
  # -- Create the ServiceAccount's Role and RoleBinding in
  # `workspaces.namespace` (the manager writes the Workspaces), and the sync
  # Job's own ServiceAccount and Role there (`<fullname>-sync`, allowed to
  # write its result ConfigMap). No person or group is bound to anything.
  create: true

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (the container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
    # `/tmp` is an emptyDir, the only writable path with
    # `readOnlyRootFilesystem`; Kyverno's require-emptydir-requests-and-limits
    # policy wants ephemeral-storage requests and limits on such a container.
    ephemeral-storage: 50Mi
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 100Mi

observability:
  otel:
    # -- OTLP collector URL for traces, e.g.
    # `http://otlp-gateway.kube-system.svc:4317` (gRPC) or
    # `https://tempo.example.com:4318` (with protocol `http/protobuf`). Empty
    # exports nothing; inbound `traceparent` headers still propagate. With
    # `networkPolicy.enabled` the policy opens egress to it: the Service's
    # namespace for an in-cluster host, every address otherwise.
    endpoint: ""
    # -- OTLP protocol: `grpc` or `http/protobuf`.
    protocol: grpc  # @schema enum: [grpc, http/protobuf]
    # -- OTLP headers (`OTEL_EXPORTER_OTLP_HEADERS`), e.g.
    # `X-Scope-OrgID=giantswarm` for a multi-tenant collector.
    headers: ""
    # -- Resource attributes appended to the downward-API `k8s.pod.name`,
    # `k8s.namespace.name` and `k8s.node.name`.
    resourceAttributes: ""
    # -- `OTEL_TRACES_SAMPLER`. The parent-based default follows the caller's
    # sampling decision and samples `samplerArg` of the traces that start here.
    sampler: parentbased_traceidratio
    # -- `OTEL_TRACES_SAMPLER_ARG`.
    samplerArg: "0.1"
  metrics:
    # -- Serve Prometheus metrics on `GET /metrics` of the `metrics` port:
    # `mcp_server_operation_duration_seconds` per tool and
    # `http_server_request_duration_seconds` for the MCP endpoint. Off,
    # `OTEL_METRICS_EXPORTER=none`: nothing is served.
    enabled: true
    # -- Port of the metrics listener, apart from the MCP port so the OAuth
    # guard never covers it.
    port: 9464

serviceMonitor:
  # -- Render a ServiceMonitor for the `metrics` port. Also needs
  # `observability.metrics.enabled`.
  enabled: false
  # -- Scrape interval; empty uses the Prometheus Operator default.
  interval: ""
  # -- Labels on the ServiceMonitor, beside the chart's own. The Giant Swarm
  # observability platform routes a scrape to a Mimir tenant by
  # `observability.giantswarm.io/tenant`; a monitor without it writes to no
  # tenant.
  labels: {}  # @schema additionalProperties: true

logging:
  # -- Enable debug logging.
  verbose: false

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
