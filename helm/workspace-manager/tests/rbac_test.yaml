suite: rbac
templates:
  - templates/rbac.yaml
  - templates/sync-rbac.yaml
release:
  name: workspace-manager
  namespace: agent-platform
tests:
  - it: lets the manager's ServiceAccount write Workspaces and claim their volumes in the workspaces' namespace
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        isKind:
          of: Role
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: kagent
      - documentIndex: 0
        equal:
          path: rules
          value:
            - apiGroups: [workspace-manager.giantswarm.io]
              resources: [workspaces]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [workspace-manager.giantswarm.io]
              resources: [workspaces/status]
              verbs: [get, update, patch]
            # The claim's owner reference sets blockOwnerDeletion on its
            # Workspace, which OwnerReferencesPermissionEnforcement admits
            # only with update on the owner's finalizers.
            - apiGroups: [workspace-manager.giantswarm.io]
              resources: [workspaces/finalizers]
              verbs: [update]
            # The claim is made, grown, and deleted with a deleted
            # Workspace's last session directory.
            - apiGroups: [""]
              resources: [persistentvolumeclaims]
              verbs: [get, create, patch, delete]
            # The sync Job's selection and the last sync's manifest.
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get, create, update]
            # The Job's credentials, server-side applied: never read.
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create, patch]
            # The sync Jobs: started and watched, never deleted.
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [get, list, watch, create]
            # The controller's election among the replicas.
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, create, update]
      - documentIndex: 1
        equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: workspace-manager
              namespace: agent-platform

  - it: lets the manager read the PersistentVolumes and the StorageClass, and nothing else cluster-wide
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 2
        isKind:
          of: ClusterRole
      - documentIndex: 2
        equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [persistentvolumes]
              verbs: [get]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get]
      - documentIndex: 3
        equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: workspace-manager
              namespace: agent-platform

  # Members are bound to nothing: every binding names a ServiceAccount, so no
  # member gains a right on Workspaces, PVCs or Jobs, whatever
  # organizations lists.
  - it: binds only ServiceAccounts, never a person or a group
    set:
      organizations:
        acme:
          memberGroups: [acme-devs]
    documentSelector:
      path: kind
      value: RoleBinding
      matchMany: true
    asserts:
      - lengthEqual:
          path: subjects
          count: 1
      - equal:
          path: subjects[0].kind
          value: ServiceAccount

  # The verbs are pinned above; what the manager owns it never deletes (a
  # claim, a Job: they go with their Workspace) and what it writes for the
  # Job it never reads back (the credentials Secret).
  - it: deletes nothing and reads no Secret
    documentSelector:
      path: kind
      value: Role
      matchMany: true
    asserts:
      - notContains:
          path: rules
          content:
            verbs: [delete]
          any: true
      - notContains:
          path: rules
          content:
            resources: [secrets]
            verbs: [get]
          any: true

  - it: renders nothing without rbac.create
    set:
      rbac:
        create: false
    asserts:
      - hasDocuments:
          count: 0
