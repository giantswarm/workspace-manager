{{- if .Values.crds.install }}
{{- /*
The API's CRDs, generated from api/ into files/crds (`make generate`).
Rendered as templates rather than from crds/ so an upgrade updates them; kept
on uninstall, so removing the chart never deletes a workspace.
*/}}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $_ := set $crd.metadata "labels" (include "workspace-manager.labels" $ | fromYaml) }}
{{- $_ := set $crd.metadata.annotations "helm.sh/resource-policy" "keep" }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
