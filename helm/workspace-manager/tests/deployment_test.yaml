# What the Deployment renders from the values: the server's arguments, its
# OAuth contract with muster and Dex, and the hardened pod.
#
# Run with: make helm-test (helm unittest helm/workspace-manager)
suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: workspace-manager
  namespace: agent-platform
chart:
  appVersion: 1.2.3
tests:
  - it: serves MCP for the kagent namespace, without OAuth by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - serve
            - --listen=:8080
            - --in-cluster=true
            - --namespace=kagent
            - --sync-cycle=10m
            - --sync-refresh-after=1h
            - --sessions-cleanup-after=720h
            - --sessions-poll=30s
            - --sizing-factor=1.5
            - --sizing-headroom=4Gi
            - --sizing-headroom-share=0.5
            - --sync-job-template=/etc/workspace-manager/sync-job/job.yaml
            - --mcp-path=/mcp
      - equal:
          path: spec.template.spec.containers[0].image
          value: gsoci.azurecr.io/giantswarm/workspace-manager:1.2.3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET
          any: true

  # The controller reads the template at start: the Job template ConfigMap is
  # mounted, and a change of it rolls the pod through the checksum.
  - it: mounts the sync Job template and names this replica for the election
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sync-job
            mountPath: /etc/workspace-manager/sync-job
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sync-job
            configMap:
              name: workspace-manager-sync-job
      - isNotEmpty:
          path: spec.template.metadata.annotations.checksum/sync-job
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: passes the sizing rule
    set:
      storage:
        sizing:
          factor: 2
          headroom: 8Gi
          headroomShare: 0.25
          maxSize: 500Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sizing-factor=2
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sizing-headroom=8Gi
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sizing-headroom-share=0.25
      - contains:
          path: spec.template.spec.containers[0].args
          content: --sizing-max-size=500Gi

  - it: passes each Organization's member groups
    set:
      organizations:
        acme:
          memberGroups: [acme-devs, acme-admins]
        umbrella:
          memberGroups: [umbrella-devs]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --organization=acme=acme-devs,acme-admins
      - contains:
          path: spec.template.spec.containers[0].args
          content: --organization=umbrella=umbrella-devs

  # The default arguments above carry no --storage-class: the controller then
  # claims no volume and names the value in every Workspace's condition,
  # never the cluster's default class.
  - it: passes the StorageClass every workspace volume is claimed from
    set:
      storage:
        storageClassName: efs-rwx
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --storage-class=efs-rwx

  - it: runs non-root with a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  - it: runs two replicas when asked
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: validates Dex tokens from the platform identity contract
    set:
      oauth:
        enabled: true
      global:
        domain: example.com
        identity:
          issuerUrl: https://dex.example.com
          clientId: platform-client
          existingSecret: platform-oauth
          ca:
            secretName: dex-ca
            key: ca.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --enable-oauth=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-base-url=https://workspace-manager.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dex-issuer-url=https://dex.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dex-client-id=platform-client
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client
      - contains:
          path: spec.template.spec.containers[0].args
          content: --dex-ca-file=/etc/workspace-manager/idp-ca/ca.pem
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: platform-oauth
                key: dex-client-secret
      - contains:
          path: spec.template.spec.volumes
          content:
            name: idp-ca
            secret:
              secretName: dex-ca
              items:
                - key: ca.pem
                  path: ca.pem

  - it: trusts the audiences it is given, de-duplicated, order kept
    set:
      oauth:
        enabled: true
        baseURL: https://wm.example.com
        existingSecret: oauth
        trustedAudiences: [platform-client, dex-k8s-authenticator, platform-client]
        dex:
          issuerURL: https://dex.example.com
          clientID: platform-client
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client,dex-k8s-authenticator

  - it: trusts the audiences muster requires next to its own, without duplicates
    set:
      oauth:
        enabled: true
        baseURL: https://wm.example.com
        existingSecret: oauth
        trustedAudiences: [platform-client]
        dex:
          issuerURL: https://dex.example.com
          clientID: platform-client
      muster:
        mcpServer:
          enabled: true
          auth:
            requiredAudiences: [dex-k8s-authenticator, platform-client]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client,dex-k8s-authenticator

  - it: trusts the required audiences next to the platform client of the identity contract
    set:
      oauth:
        enabled: true
      global:
        domain: example.com
        identity:
          issuerUrl: https://dex.example.com
          clientId: platform-client
          existingSecret: platform-oauth
      muster:
        mcpServer:
          enabled: true
          auth:
            requiredAudiences: [kubernetes]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --oauth-trusted-audiences=platform-client,kubernetes

  - it: refuses OAuth without a Dex issuer
    set:
      oauth:
        enabled: true
        baseURL: https://wm.example.com
    asserts:
      - failedTemplate:
          errorPattern: oauth.dex.issuerURL \(or global.identity.issuerUrl\) is required

  - it: exports Prometheus metrics on their own port, or nothing
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: prometheus
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9464
            protocol: TCP

  - it: turns metrics off
    set:
      observability:
        metrics:
          enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_METRICS_EXPORTER
            value: none
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true

  - it: exports traces to an OTLP collector
    set:
      observability:
        otel:
          endpoint: http://otlp-gateway.kube-system.svc:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otlp-gateway.kube-system.svc:4317

  # The session directories' cleanup reads kagent's Sessions with a token for
  # kagent's audience only, never the API server's.
  - it: calls kagent with a projected token for its audience
    set:
      kagent:
        address: grpc://kagent-controller.kagent:8083
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kagent-address=grpc://kagent-controller.kagent:8083
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kagent-token-file=/var/run/secrets/workspace-manager/kagent/token
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kagent-token
            mountPath: /var/run/secrets/workspace-manager/kagent
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kagent-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: kagent
                    expirationSeconds: 3600
                    path: token

  - it: mounts no kagent token without kagent
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: kagent-token
          any: true
