# Repo-owned additions to the generated .circleci/workflows.yml. The setup
# workflow in config.yml deep-merges this file into it at pipeline runtime;
# devctl never touches it.
#
#   - chart-test: helm lint plus the helm-unittest suites in
#     helm/workspace-manager/tests/. Not reachable from `make test`: the
#     unittest plugin is not in the architect go image, so the job runs in a
#     plain container with a pinned helm.
#   - envtest: the tests behind the envtest build tag, which need a real API
#     server (the sign-in store's cross-replica refresh), through
#     `make test-envtest`; setup-envtest fetches kube-apiserver and etcd.
version: 2.1

jobs:
  chart-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
    steps:
      - checkout
      - run:
          name: Install helm
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            helm version --short
      - run:
          name: Run chart tests
          command: make helm-test

  envtest:
    docker:
      - image: cimg/go:1.26
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Run envtest tests
          command: make test-envtest

workflows:
  build:
    jobs:
    # Independent of go-build: a chart-only PR gets the signal without waiting
    # on the Go build. Same tag filter as the other test jobs.
    - chart-test:
        filters:
          tags:
            only: /^v.*/
    - envtest:
        filters:
          tags:
            only: /^v.*/
