suite: crds
templates:
  - templates/crds.yaml
release:
  name: workspace-manager
  namespace: agent-platform
tests:
  - it: installs the Workspace CRD, kept on uninstall
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: workspaces.workspace-manager.giantswarm.io
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: workspace-manager
      - equal:
          path: spec.versions[0].name
          value: v1alpha1

  - it: renders nothing without crds.install
    set:
      crds:
        install: false
    asserts:
      - hasDocuments:
          count: 0
