{{- if .Values.rbac.create }}
{{- /*
The sync Job's ServiceAccount. A Job runs in the workspaces' namespace, so
its account lives there, apart from the manager's. It writes the manifest of
a sync into the result ConfigMap the controller names (`sync
--result-configmap`), nothing else.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workspace-manager.fullname" . }}-sync
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workspace-manager.fullname" . }}-sync
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}-sync
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workspace-manager.fullname" . }}-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.fullname" . }}-sync
    namespace: {{ .Values.workspaces.namespace }}
{{- end }}
