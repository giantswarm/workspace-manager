{{- with .Values.muster.mcpServer.auth.provider }}
{{- if not $.Values.oauth.enabled }}
{{- fail "muster.mcpServer.auth.provider pins the MCPServer to the provider's App and forwards the person's Dex ID token beside its token, which the server validates as an OAuth resource server: set oauth.enabled" }}
{{- end }}
{{- $names := list }}
{{- range $.Values.providers }}{{ $names = append $names .name }}{{ end }}
{{- if not (has . $names) }}
{{- fail (printf "muster.mcpServer.auth.provider %q names no provider instance of providers" .) }}
{{- end }}
{{- end }}
{{- with .Values.muster.mcpServer.auth.providerApps }}
{{- if not $.Values.oauth.enabled }}
{{- fail "muster.mcpServer.auth.providerApps has muster attach the person's App tokens beside the forwarded Dex ID token, which the server validates as an OAuth resource server: set oauth.enabled" }}
{{- end }}
{{- $names := list }}
{{- range $.Values.providers }}{{ $names = append $names .name }}{{ end }}
{{- range . }}
{{- if not (has . $names) }}
{{- fail (printf "muster.mcpServer.auth.providerApps %q names no provider instance of providers" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.muster.mcpServer.enabled }}
{{- /*
Registers this server with muster. Tools appear as x_<name>_<tool>. With
oauth.enabled the CR carries the auth block: muster forwards the session's Dex
id_token (forwardToken), which this server validates against its trusted
audiences (oauth.trustedAudiences plus the requiredAudiences below), and
requests the requiredAudiences at login. muster.mcpServer.auth.providerApps
names the provider instances whose App muster keeps (its
aggregator.providerApps): muster attaches the person's token of each App they
granted in X-Muster-Grant-<instance>. Without OAuth muster connects
anonymously. With muster.mcpServer.auth.provider the auth pins that
provider's App, the single-provider predecessor of providerApps: the person grants it once in muster, the bearer is
the person's App token, and forwardIdentity puts the Dex ID token in
X-Muster-Id-Token beside it. No person's token is the workspace-manager's.
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.mcpServer.name }}
  namespace: {{ .Release.Namespace }}
  {{- /*
  The chart's labels, the muster identity (muster.giantswarm.io/type) and the
  Agent Platform tier (agent-platform.giantswarm.io/tool-group: agent-platform,
  the platform's own management surface -- the tier the portal, the toolset
  presets and the docs group this server under). muster.mcpServer.labels adds
  to and overrides all of them.
  */}}
  {{- $labels := include "workspace-manager.labels" . | fromYaml }}
  {{- $labels = mergeOverwrite $labels (dict "muster.giantswarm.io/type" "workspace-manager" "agent-platform.giantswarm.io/tool-group" "agent-platform") (.Values.muster.mcpServer.labels | default dict) }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- with .Values.muster.mcpServer.displayName }}
  annotations:
    ui.giantswarm.io/display-name: {{ . | quote }}
  {{- end }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  url: http://{{ include "workspace-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}{{ .Values.mcp.path }}
  {{- with .Values.muster.mcpServer.description }}
  description: {{ . | quote }}
  {{- end }}
  {{- with .Values.muster.mcpServer.timeout }}
  timeout: {{ . | int }}
  {{- end }}
  {{- if and .Values.oauth.enabled .Values.muster.mcpServer.auth.provider }}
  {{- with .Values.muster.mcpServer.auth.authorizationServer }}
  auth:
    type: oauth
    authorizationServer:
      issuer: {{ required "muster.mcpServer.auth.authorizationServer.issuer is required with muster.mcpServer.auth.provider" .issuer | quote }}
      {{- with .expectedIssuer }}
      expectedIssuer: {{ . | quote }}
      {{- end }}
      authorizationEndpoint: {{ .authorizationEndpoint | quote }}
      tokenEndpoint: {{ .tokenEndpoint | quote }}
      {{- with .revocationEndpoint }}
      revocationEndpoint: {{ . | quote }}
      {{- end }}
      {{- with .scopes }}
      scopes: {{ . | quote }}
      {{- end }}
      clientCredentialsSecretRef:
        name: {{ required "muster.mcpServer.auth.authorizationServer.clientCredentialsSecretRef.name is required with muster.mcpServer.auth.provider" .clientCredentialsSecretRef.name | quote }}
        namespace: {{ .clientCredentialsSecretRef.namespace | default $.Release.Namespace | quote }}
      grantScope: {{ .grantScope | quote }}
    forwardIdentity: true
    {{- with $.Values.muster.mcpServer.auth.providerApps }}
    providerApps:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $.Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- else if .Values.oauth.enabled }}
  auth:
    type: oauth
    {{- with .Values.muster.mcpServer.auth.providerApps }}
    forwardToken: true
    providerApps:
      {{- toYaml . | nindent 6 }}
    {{- else }}
    forwardToken: {{ .Values.muster.mcpServer.auth.forwardToken }}
    {{- end }}
    {{- with .Values.muster.mcpServer.auth.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
