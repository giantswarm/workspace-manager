{{- if .Values.rbac.create }}
{{- /*
The ServiceAccount's permissions in the workspaces' namespace: the manager
writes the workspace objects, the volume and the jobs itself, once the
caller's Organization is checked. The Role carries no rules yet; each workspace
operation adds the rules it writes with.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workspace-manager.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
