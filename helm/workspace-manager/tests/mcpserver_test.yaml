# The muster registration: off by default, one streamable-http MCPServer at
# the Service, unpinned unless pinned to a provider instance's App (the
# person's grant in muster), the auth block only with OAuth, the audiences the MCPServer requires are the same
# ones the Deployment trusts (deployment_test.yaml), and the display name the
# portal shows as an annotation.
#
# Run with: make helm-test (helm unittest helm/workspace-manager)
suite: mcpserver registration
templates:
  - templates/mcpserver.yaml
release:
  name: workspace-manager
  namespace: agent-platform
set:
  muster:
    mcpServer:
      enabled: true
      auth:
        requiredAudiences:
          - dex-k8s-authenticator
  oauth:
    enabled: true
    existingSecret: platform-oauth
  global:
    domain: example.com
    identity:
      issuerUrl: https://dex.example.com
      clientId: platform-client
tests:
  - it: registers nothing by default
    set:
      muster:
        mcpServer:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: registers one streamable-http MCPServer at the Service, named for the tool prefix
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: MCPServer
      - isAPIVersion:
          of: muster.giantswarm.io/v1alpha1
      - equal:
          path: metadata.name
          value: workspace-manager
      - equal:
          path: metadata.namespace
          value: agent-platform
      - equal:
          path: spec.type
          value: streamable-http
      - equal:
          path: spec.url
          value: http://workspace-manager.agent-platform.svc.cluster.local:8080/mcp
      - equal:
          path: spec.autoStart
          value: true

  - it: forwards the session token, requires the apiserver's audience and pins no authorization server
    asserts:
      - equal:
          path: spec.auth.type
          value: oauth
      - equal:
          path: spec.auth.forwardToken
          value: true
      - equal:
          path: spec.auth.requiredAudiences
          value:
            - dex-k8s-authenticator
      - notExists:
          path: spec.auth.authorizationServer
      - notExists:
          path: spec.auth.forwardIdentity

  - it: connects anonymously without OAuth
    set:
      oauth:
        enabled: false
    asserts:
      - notExists:
          path: spec.auth

  - it: carries the tool-group label next to the muster type label
    asserts:
      - equal:
          path: metadata.labels["muster.giantswarm.io/type"]
          value: workspace-manager
      - equal:
          path: metadata.labels["agent-platform.giantswarm.io/tool-group"]
          value: agent-platform
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: workspace-manager

  - it: lets muster.mcpServer.labels add and override labels
    set:
      muster:
        mcpServer:
          labels:
            agent-platform.giantswarm.io/tool-group: infrastructure
            example.com/extra: "yes"
    asserts:
      - equal:
          path: metadata.labels["agent-platform.giantswarm.io/tool-group"]
          value: infrastructure
      - equal:
          path: metadata.labels["example.com/extra"]
          value: "yes"
      - equal:
          path: metadata.labels["muster.giantswarm.io/type"]
          value: workspace-manager

  - it: changes the tool prefix with a custom name, the URL staying the Service's
    set:
      muster:
        mcpServer:
          name: workspaces
    asserts:
      - equal:
          path: metadata.name
          value: workspaces
      - equal:
          path: spec.url
          value: http://workspace-manager.agent-platform.svc.cluster.local:8080/mcp

  - it: follows the Service port and the MCP path
    set:
      service:
        port: 9090
      mcp:
        path: /api/mcp
    asserts:
      - equal:
          path: spec.url
          value: http://workspace-manager.agent-platform.svc.cluster.local:9090/api/mcp

  - it: leaves the tool timeout to muster by default
    asserts:
      - notExists:
          path: spec.timeout

  - it: renders the tool timeout from muster.mcpServer.timeout
    set:
      muster:
        mcpServer:
          timeout: 90
    asserts:
      - equal:
          path: spec.timeout
          value: 90

  - it: carries the display name the portal shows
    asserts:
      - equal:
          path: metadata.annotations["ui.giantswarm.io/display-name"]
          value: Workspace Manager

  - it: renders the display name from muster.mcpServer.displayName
    set:
      muster:
        mcpServer:
          displayName: "Workspaces: all of them"
    asserts:
      - equal:
          path: metadata.annotations["ui.giantswarm.io/display-name"]
          value: "Workspaces: all of them"

  - it: renders no annotation with an empty display name
    set:
      muster:
        mcpServer:
          displayName: ""
    asserts:
      - notExists:
          path: metadata.annotations["ui.giantswarm.io/display-name"]

  - it: pins a provider instance's App, forwarding the identity beside the person's token
    set:
      providers:
        - name: github
          kind: github
          values:
            app: {id: "1", privateKey: {name: app, key: private-key}}
      muster:
        mcpServer:
          auth:
            provider: github
            authorizationServer:
              issuer: https://github.com/apps/example-agents
              clientCredentialsSecretRef:
                name: workspace-github-oauth-client
    asserts:
      - equal:
          path: spec.auth
          value:
            type: oauth
            authorizationServer:
              issuer: https://github.com/apps/example-agents
              expectedIssuer: https://github.com/login/oauth
              authorizationEndpoint: https://github.com/login/oauth/authorize
              tokenEndpoint: https://github.com/login/oauth/access_token
              clientCredentialsSecretRef:
                name: workspace-github-oauth-client
                namespace: agent-platform
              grantScope: subject
            forwardIdentity: true
            requiredAudiences:
              - dex-k8s-authenticator

  - it: pins a GitLab instance's application with its revocation endpoint
    set:
      providers:
        - name: gitlab
          kind: gitlab
          values:
            url: https://gitlab.example.com
            token: {name: workspace-gitlab, key: token}
      muster:
        mcpServer:
          auth:
            provider: gitlab
            authorizationServer:
              issuer: https://gitlab.example.com
              expectedIssuer: ""
              authorizationEndpoint: https://gitlab.example.com/oauth/authorize
              tokenEndpoint: https://gitlab.example.com/oauth/token
              revocationEndpoint: https://gitlab.example.com/oauth/revoke
              scopes: api read_user read_repository write_repository
              clientCredentialsSecretRef:
                name: workspace-gitlab
    asserts:
      - equal:
          path: spec.auth.authorizationServer
          value:
            issuer: https://gitlab.example.com
            authorizationEndpoint: https://gitlab.example.com/oauth/authorize
            tokenEndpoint: https://gitlab.example.com/oauth/token
            revocationEndpoint: https://gitlab.example.com/oauth/revoke
            scopes: api read_user read_repository write_repository
            clientCredentialsSecretRef:
              name: workspace-gitlab
              namespace: agent-platform
            grantScope: subject

  - it: refuses a pin to a provider instance it does not configure
    set:
      muster:
        mcpServer:
          auth:
            provider: github
            authorizationServer:
              issuer: https://github.com/apps/example-agents
              clientCredentialsSecretRef:
                name: workspace-github-oauth-client
    asserts:
      - failedTemplate:
          errorMessage: muster.mcpServer.auth.provider "github" names no provider instance of providers

  - it: refuses a pin without the App's issuer or client
    set:
      providers:
        - name: github
          kind: github
          values:
            app: {id: "1", privateKey: {name: app, key: private-key}}
      muster:
        mcpServer:
          auth:
            provider: github
    asserts:
      - failedTemplate:
          errorMessage: muster.mcpServer.auth.authorizationServer.issuer is required with muster.mcpServer.auth.provider

  - it: refuses a pin without OAuth
    set:
      oauth:
        enabled: false
      providers:
        - name: github
          kind: github
          values:
            app: {id: "1", privateKey: {name: app, key: private-key}}
      muster:
        mcpServer:
          auth:
            provider: github
    asserts:
      - failedTemplate: {}
