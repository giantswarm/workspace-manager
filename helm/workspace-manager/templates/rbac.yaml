{{- if .Values.rbac.create }}
{{- /*
The ServiceAccount's permissions in the workspaces' namespace: the manager
writes the workspace objects, the volume and the jobs itself, once the
caller's Organization is checked. Only the ServiceAccount is bound: a member
of an Organization gets no right here, on Workspaces, PVCs or Jobs alike.
Each workspace operation adds the rules it writes with. The sync Job's
account is in sync-rbac.yaml.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [workspace-manager.giantswarm.io]
    resources: [workspaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [workspace-manager.giantswarm.io]
    resources: [workspaces/status]
    verbs: [get, update, patch]
  {{- /*
  The claim's owner reference blocks its Workspace's deletion
  (blockOwnerDeletion), which a cluster enforcing owner-reference permissions
  admits only from an account that may update the owner's finalizers.
  */}}
  - apiGroups: [workspace-manager.giantswarm.io]
    resources: [workspaces/finalizers]
    verbs: [update]
  {{- /*
  The workspace's volume: the controller claims it from storage.storageClassName,
  grows it where the class provisions a size and never deletes it; the claim is
  the Workspace's, by its owner reference, and goes with it.
  */}}
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, patch]
  {{- /*
  The sync cycle's input and result: the selection the controller writes for
  the Job, and the manifest the Job writes, which the controller reads after
  the Job and authorize_workspace checks the person against.
  */}}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  {{- /*
  The Job's credentials Secret, server-side applied per cycle and emptied
  after it: the manager never reads a Secret of this namespace.
  */}}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch]
  {{- /*
  The sync Jobs: started per cycle, watched to their end, never deleted (their
  TTL and their Workspace's deletion remove them).
  */}}
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  {{- /*
  The controller's leader election among the replicas.
  */}}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workspace-manager.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- /*
A workspace's volume is named by its CSI driver and handle, which only the
claim's PersistentVolume carries: the workspace tools show it and
authorize_workspace's grant names it. Whether the StorageClass provisions a
size to grow is its allowVolumeExpansion. Nothing else is read cluster-wide.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "workspace-manager.fullname" . }}-volumes
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}-volumes
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "workspace-manager.fullname" . }}-volumes
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
