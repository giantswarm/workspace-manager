{{- if .Values.rbac.create }}
{{- /*
The ServiceAccount's own permissions in the workspaces' namespace. The Role
carries no rules yet: every request acts as the caller with the caller's Dex
token, and the server's own work adds the rules it needs when it arrives.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workspace-manager.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
