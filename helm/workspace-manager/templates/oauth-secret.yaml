{{- if include "workspace-manager.oauthRendersSecret" . }}
{{- /*
The Dex client secret when no existing Secret is named (neither
oauth.existingSecret nor the platform's global.identity.existingSecret).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workspace-manager.fullname" . }}-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  dex-client-secret: {{ required "oauth.dex.clientSecret or oauth.existingSecret is required when oauth.enabled" .Values.oauth.dex.clientSecret | quote }}
{{- end }}
