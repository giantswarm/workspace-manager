{{- if .Values.rbac.create }}
{{- /*
The ServiceAccount's permissions in the workspaces' namespace: the manager
writes the workspace objects, the volume and the jobs itself, once the
caller's Organization is checked. Only the ServiceAccount is bound: a member
of an Organization gets no right here, on Workspaces, PVCs or Jobs alike.
Each workspace operation adds the rules it writes with. The sync Job's
account is in sync-rbac.yaml.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [workspace-manager.giantswarm.io]
    resources: [workspaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [workspace-manager.giantswarm.io]
    resources: [workspaces/status]
    verbs: [get, update, patch]
  {{- /*
  The workspace's volume: the controller claims it from storage.storageClassName
  and never deletes it; the claim is the Workspace's, by its owner reference,
  and goes with it.
  */}}
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  {{- /*
  The last sync's manifest, which the sync Job writes and authorize_workspace
  checks the person against.
  */}}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Values.workspaces.namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workspace-manager.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.grant.signingKey.name }}
{{- /*
The workspace grant names the volume by its CSI driver and handle, which only
the claim's PersistentVolume carries: authorize_workspace reads it, nothing
else.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "workspace-manager.fullname" . }}-volumes
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "workspace-manager.fullname" . }}-volumes
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "workspace-manager.fullname" . }}-volumes
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
