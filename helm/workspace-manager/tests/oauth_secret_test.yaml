suite: oauth secret
templates:
  - templates/oauth-secret.yaml
release:
  name: workspace-manager
  namespace: agent-platform
tests:
  - it: renders the Dex client secret when no existing Secret is named
    set:
      oauth:
        enabled: true
        dex:
          clientSecret: lab-only
    asserts:
      - equal:
          path: stringData.dex-client-secret
          value: lab-only

  - it: renders nothing with the platform's Secret
    set:
      oauth:
        enabled: true
      global:
        identity:
          existingSecret: platform-oauth
    asserts:
      - hasDocuments:
          count: 0
