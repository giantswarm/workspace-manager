apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workspace-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workspace-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "workspace-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.providers }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.providers }}
        {{- /* The server reads the providers at start only. */}}
        checksum/providers: {{ include (print $.Template.BasePath "/providers-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "workspace-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "workspace-manager.serviceAccountName" . }}
      {{- /*
      The manager acts as its ServiceAccount (rbac.yaml).
      */}}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:8080
            - --in-cluster=true
            - --namespace={{ .Values.workspaces.namespace }}
            - --mcp-path={{ .Values.mcp.path }}
            {{- range $org, $o := .Values.organizations }}
            - --organization={{ $org }}={{ join "," $o.memberGroups }}
            {{- end }}
            {{- if .Values.providers }}
            - --providers-config=/etc/workspace-manager/providers/providers.yaml
            {{- end }}
            {{- if .Values.oauth.enabled }}
            - --enable-oauth=true
            - --oauth-base-url={{ include "workspace-manager.oauthBaseURL" . }}
            - --dex-issuer-url={{ include "workspace-manager.oauthDexIssuerURL" . }}
            - --dex-client-id={{ include "workspace-manager.oauthDexClientID" . }}
            {{- with include "workspace-manager.oauthTrustedAudiences" . }}
            - --oauth-trusted-audiences={{ . }}
            {{- end }}
            {{- if .Values.oauth.dex.allowPrivateURLs }}
            - --allow-private-oauth-urls=true
            {{- end }}
            {{- if include "workspace-manager.oauthDexCASecretName" . }}
            - --dex-ca-file=/etc/workspace-manager/idp-ca/{{ include "workspace-manager.oauthDexCASecretKey" . }}
            {{- end }}
            {{- if .Values.oauth.sso.allowPrivateIPs }}
            - --sso-allow-private-ips=true
            {{- end }}
            {{- if .Values.oauth.allowPublicClientRegistration }}
            - --allow-public-client-registration=true
            {{- end }}
            {{- if .Values.providers }}
            {{- /* The person's provider sign-ins, sealed with these keys. */}}
            - --signin-keys-secret={{ required "signin.keys.secretName is required with providers and oauth.enabled" .Values.signin.keys.secretName }}
            - --signin-current-key={{ required "signin.keys.current is required with providers and oauth.enabled" .Values.signin.keys.current }}
            {{- with .Values.tokenExchange.clientID }}
            {{- /* POST /token for the installation's kagent client. */}}
            - --token-exchange-client-id={{ . }}
            - --token-exchange-client-secret={{ required "tokenExchange.clientSecret.name is required with tokenExchange.clientID" $.Values.tokenExchange.clientSecret.name }}/{{ required "tokenExchange.clientSecret.key is required with tokenExchange.clientID" $.Values.tokenExchange.clientSecret.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.logging.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
          The metrics exporter env below always contributes at least one
          entry (prometheus or none), so this block is unconditional.
          */}}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.oauth.enabled }}
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "workspace-manager.oauthSecretName" . }}
                  key: dex-client-secret
            {{- end }}
            {{- with .Values.observability.otel }}
            {{- if .endpoint }}
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .protocol | default "grpc" | quote }}
            {{- with .headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ . | quote }}
            {{- end }}
            {{- with .sampler }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ . | quote }}
            {{- end }}
            {{- with .samplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME){{- with .resourceAttributes }},{{ . }}{{- end }}"
            {{- end }}
            {{- end }}
            {{- if .Values.observability.metrics.enabled }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: "0.0.0.0"
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ .Values.observability.metrics.port | quote }}
            {{- else }}
            - name: OTEL_METRICS_EXPORTER
              value: none
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
              protocol: TCP
            {{- end }}
          # Up to 5m30s to serve /healthz: building the Dex provider waits up to
          # 5 minutes for an unavailable Dex, and liveness only starts after this.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 33
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $idpCA := "" }}
          {{- if .Values.oauth.enabled }}{{ $idpCA = include "workspace-manager.oauthDexCASecretName" . }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.providers }}
            - name: providers
              mountPath: /etc/workspace-manager/providers
              readOnly: true
            {{- end }}
            {{- if $idpCA }}
            - name: idp-ca
              mountPath: /etc/workspace-manager/idp-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.providers }}
        - name: providers
          configMap:
            name: {{ include "workspace-manager.fullname" . }}-providers
        {{- end }}
        {{- if $idpCA }}
        - name: idp-ca
          secret:
            secretName: {{ $idpCA }}
            items:
              - key: {{ include "workspace-manager.oauthDexCASecretKey" . }}
                path: {{ include "workspace-manager.oauthDexCASecretKey" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
